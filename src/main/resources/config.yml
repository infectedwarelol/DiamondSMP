# DiamondSMP core configuration.
# Every message lives in messages.yml. Use /diamondsmp reload after editing.
#
# When a new jar adds options they are written into this file automatically.
# Your values are kept and the previous file is saved next to it as config.yml.old.
# Durations accept 90s, 2m, 1m30s, 1h or a plain number of seconds.

config-version: 8

# Shown by /store and /discord, and usable in every message of messages.yml
# as %store% and %discord%. Add more keys here to get more %key% tokens.
links:
  store: "store.diamondsmp.net"
  discord: "discord.gg/diamondsmp"

storage:
  # Only sqlite is bundled. The file lives in plugins/DiamondSMP/.
  type: sqlite
  file: data.db
  # How often the data of online players is written to disk. They are also
  # saved when they leave and when the server stops.
  autosave: 5m

teleport:
  # Countdown before /spawn, /warp, /back and /top teleport. The remaining
  # seconds are shown in chat and in the action bar every second. 0 teleports
  # instantly. /tp, /tphere and /tpall never wait.
  # diamondsmp.teleport.bypass skips the countdown and the cooldown.
  warmup:
    spawn: 5s
    warp: 5s
    back: 5s
    top: 5s
  # Time before the same kind of teleport can be used again.
  cooldown:
    spawn: 0s
    warp: 5s
    back: 10s
    top: 0s
  # Moving to another block or taking damage cancels a running warmup.
  cancel-on-move: true
  cancel-on-damage: true

spawn:
  # Players are sent to spawn the very first time they join.
  teleport-on-first-join: true
  # Players are sent to spawn every time they join.
  teleport-on-join: true
  # Players respawn at spawn after dying.
  teleport-on-respawn: true
  # A circle around spawn. diamondsmp.spawn.protection.bypass ignores the
  # build rule. PvP is blocked when either fighter stands inside it.
  protection:
    enabled: true
    radius: 30
    disable-pvp: true
    disable-build: true

warps:
  # When true, each warp also needs diamondsmp.warp.<name>.
  per-warp-permission: false

ffa:
  # Keep items and levels on death.
  keep-inventory: false
  # The hunger bar never goes down.
  no-hunger: true
  # Skip the death screen. Sets the immediate respawn game rule in every world.
  auto-respawn: true
  # Replace the death messages with kill.message and death.message from messages.yml.
  custom-death-messages: true

# Kill streaks. A streak counts kills without dying and is stored with the
# rest of the player data, so it survives restarts.
killstreak:
  # Streaks announced to the whole server.
  milestones: [5, 10, 15, 20, 25, 50, 100]
  # Above the highest milestone, keep announcing every this many kills.
  # 0 stops announcing past the last milestone.
  repeat-above-highest: 25
  # A streak is only announced as ended when it was at least this high.
  # 0 never announces it.
  announce-end-minimum: 5
  action-bar:
    enabled: true
    # Show the current streak to the killer after every kill.
    on-kill: true
  titles:
    # Show a title to the killer on milestones.
    enabled: true
    fade-in-ticks: 10
    stay-ticks: 40
    fade-out-ticks: 10
  sounds:
    milestone:
      enabled: true
      sound: minecraft:entity.player.levelup
      volume: 1.0
      pitch: 1.0
    streak-end:
      enabled: true
      sound: minecraft:entity.ender_dragon.growl
      volume: 0.7
      pitch: 1.0
  leaderboard:
    # Positions exposed by the top placeholders:
    #   %diamondsmp_topcurrent_<rank>_name%  _value%  _uuid%
    #   %diamondsmp_tophighest_<rank>_name%  _value%  _uuid%
    # where <rank> goes from 1 to size.
    size: 10
    # The cached boards are rebuilt at most this often, and only after a
    # streak changed.
    refresh: 5s
    # Shown for positions nobody holds yet.
    empty-name: "---"
    empty-value: "0"

# PlaceholderAPI. Loaded only when PlaceholderAPI is installed.
#   %diamondsmp_current%  %diamondsmp_highest%  %diamondsmp_kills%
#   %diamondsmp_deaths%   %diamondsmp_kdr%      and the top placeholders above.
placeholders:
  # The same placeholders under more identifiers. Keeps old FoliaKillStreak
  # placeholders such as %fokillstreak_current% working. Remove FoliaKillStreak
  # itself, or these identifiers are already taken.
  extra-identifiers:
    - foliakillstreak
    - fokillstreak

# ajLeaderboards. When it is installed together with PlaceholderAPI, these boards
# are created on startup and updated whenever a streak changes, so no /ajlb add
# is needed. A board name is a placeholder without the % signs.
ajleaderboards:
  enabled: true
  boards:
    - diamondsmp_current
    - diamondsmp_highest
  # How often queued streak changes are pushed. Every push writes to the
  # ajLeaderboards database, so keep it reasonable on a busy server.
  push-interval: 5s

# /leaderboard opens a menu with four boards. Every player who ever joined is
# ranked, 45 per page, with their own head. Skins of offline players are
# fetched once in the background and kept in memory.
leaderboard:
  filler: GRAY_STAINED_GLASS_PANE
  sections:
    kills:
      slot: 10
      icon: DIAMOND_SWORD
    deaths:
      slot: 12
      icon: SKELETON_SKULL
    playtime:
      slot: 14
      icon: CLOCK
    killstreaks:
      slot: 16
      icon: BLAZE_POWDER

# Kill tokens. The killer receives tokens straight into their inventory; when
# it is full the rest drops at their feet. /killtoken [token|compressed]
# [amount] [player] gives them to anyone (diamondsmp.killtoken.give, op).
# Tokens carry a hidden tag, so renamed copies of the material never count,
# and the clearer never removes them from the ground.
kill-tokens:
  enabled: true
  per-kill: 1
  token:
    material: GOLD_NUGGET
    name: "&6&lKill Token"
    lore:
      - "&7Earned by killing a player."
    # Enchantment glint. The enchantment itself is always hidden.
    glow: true
  compressed:
    material: NETHER_STAR
    name: "&e&lCompressed Kill Token"
    lore:
      - "&7Worth a stack of kill tokens."
    glow: true
  sound:
    enabled: true
    sound: minecraft:entity.experience_orb.pickup
    volume: 0.8
    pitch: 1.4

kill-effects:
  # Every effect is a short show of 2 to 4 seconds: particles, display entities,
  # layered sounds and fake blocks that only the viewers see and that are put
  # back afterward. Many of them show the victim's corpse, wearing their own
  # skin, armor and weapon. Players pick one in /killeffect, or "Random" for a
  # surprise each kill. /killeffect toggle hides other players' effects.
  locked-icon: GRAY_DYE
  none-icon: BARRIER
  random-icon: ENDER_CHEST
  # The glass on the bottom row of the menu.
  filler: GRAY_STAINED_GLASS_PANE
  sounds:
    select: ui.button.click
    locked: entity.villager.no
  # Multiplies the particle count of every effect.
  density: 1.0
  performance:
    # Only players this close see and hear an effect.
    view-distance: 48
    # Effects running at once. Kills past this play no effect.
    max-active: 6
    # Past this many running effects, new ones use reduced-density.
    reduce-above: 3
    reduced-density: 0.5
    # Particles a single effect may send in one tick.
    particles-per-tick: 350
    # Hard limit on how long one effect may run.
    max-duration: 7s
  # Every effect needs diamondsmp.killeffect.<id>; "random" needs
  # diamondsmp.killeffect.random. Per effect:
  #   intensity  particle multiplier (0.1 to 3)
  #   duration   speed of the whole show, 0.5 is twice as fast, 2 twice as slow
  #   volume     sound volume (0 mutes it)
  effects:
    chains:
      enabled: true
      name: "&8&lChains of Judgement"
      icon: IRON_CHAIN
      intensity: 1.0
      duration: 1.0
      volume: 1.0
      description:
        - "&7Chains burst from the sky, bind"
        - "&7your victim tight and snap apart."
    black_hole:
      enabled: true
      name: "&5&lBlack Hole"
      icon: ENDER_EYE
      intensity: 1.0
      duration: 1.0
      volume: 1.0
      description:
        - "&7Space folds in on itself, swallows"
        - "&7your victim and erupts outward."
    thunder_god:
      enabled: true
      name: "&e&lThunder God"
      icon: LIGHTNING_ROD
      intensity: 1.0
      duration: 1.0
