      description:
        - "&7A colorful firework bursts where"
        - "&7your victim fell."
    flame_spiral:
      enabled: true
      name: "&6Flame Spiral"
      icon: BLAZE_POWDER
      description:
        - "&7A spiral of flames rises up."
    soul_rise:
      enabled: true
      name: "&3Soul Rise"
      icon: SOUL_LANTERN
      description:
        - "&7The victim's soul drifts away."
    blood_burst:
      enabled: true
      name: "&4Blood Burst"
      icon: REDSTONE
      description:
        - "&7A burst of crimson dust."
    totem_pop:
      enabled: true
      name: "&aTotem Pop"
      icon: TOTEM_OF_UNDYING
      description:
        - "&7A totem pops, but too late."
    heart_burst:
