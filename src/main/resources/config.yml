# Clearer - removes PLAYER-PLACED blocks on a timer.
#
# Only blocks a player was seen placing are ever removed. The world is never
# scanned, so natural terrain stays. Before a block is removed the clearer
# checks that the spot still holds the exact material that was placed, so a
# block that was changed in the meantime is left alone. Water placed from a
# bucket is tracked together with the water that flows out of it.
#
# The clearer ignores WorldGuard and every region plugin, and there is no
# permission to keep a block: if a player placed it, it is cleared.
# Tracked blocks are saved when the server stops and cleared after a restart.
clearer:
  enabled: true
  interval: 5m
  # Seconds before the clear at which a warning is broadcast.
  warnings:
    - 60
    - 30
    - 10
    - 5
    - 3
    - 2
    - 1
  # The materials the clearer removes. Supports * wildcards.
  blocks:
    - WATER
    - STONE
    - STONE_PRESSURE_PLATE
    - "*_BUTTON"
    - COBWEB
  # Restrict the clearer to these worlds. Leave empty for every world.
  worlds: []
  # Positions tracked at most. Past this, new placements wait for the next clear.
  max-tracked: 500000
  # Dropped items lying on the ground are cleared at the same time.
  items:
    enabled: true
    # Never removed from the ground. Supports * wildcards. Kill tokens are
    # always kept.
    protected:
      - "NETHERITE_*"
      - ENCHANTED_GOLDEN_APPLE
      - ENDER_PEARL

# Reactive distance. The more players are online, the less each client is
# sent, so a full server does not flood every connection with chunk and
# movement packets.
#
# Every threshold is an online player count. The highest one reached is used.
#   view-distance    chunks sent to each client. Never raised above the
#                    world's own setting. 0 keeps the world's setting.
#   player-distance  players further away than this many blocks are hidden
#                    from each other. 0 shows everyone. Hidden players also
#                    leave the tab list until they come closer again.
reactive-distance:
  enabled: true
  # How often the online count is checked.
  check-interval: 5s
  # A tier is only left again once the count drops this many players below
  # its threshold, so a count bouncing around a threshold does not resend
  # chunks to everyone every few seconds.
  hysteresis: 5
  # Ticks between two player-distance passes.
  visibility-interval: 10
  thresholds:
    0:
      view-distance: 0
      player-distance: 0
    40:
      view-distance: 8
      player-distance: 96
    80:
      view-distance: 6
      player-distance: 64
    120:
      view-distance: 5
      player-distance: 48
    160:
      view-distance: 4
      player-distance: 32

# Command hider. Players only see the commands they have the permission for,
# both in the command list and in tab completion. Running a command without
# its permission, or one that does not exist, shows general.unknown-command
# from messages.yml and plays the sound below, so hidden commands cannot be
# told apart from missing ones. diamondsmp.commandhider.bypass ignores
# hidden-commands and hide-namespaced, but never the permission check.
command-hider:
  enabled: true
  # Hide plugin:command and minecraft:command labels.
  hide-namespaced: true
  # Always hidden and blocked, even when the player has the permission.
  hidden-commands:
    - pl
    - plugins
    - ver
    - version
    - about
    - icanhasbukkit
    - "?"
    - help
    - paper
    - folia
  sound:
    enabled: true
    sound: minecraft:entity.villager.no
    volume: 1.0
    pitch: 1.0

# ScreenShare - /freeze a player at a freeze point and check them in voice.
# Create freeze points with /setfreezepoint; they are kept in the database.
# The Discord invite comes from links.discord above.
screenshare:
  # Time the frozen player has to join the voice channel.
  voice-channel-time: 2m
  # Show the timer in the frozen player's action bar.
  action-bar: true
  # Blocks in front of the frozen player where the staff member is placed.
  # 0 puts the staff member on the freeze point itself.
  staff-distance: 1.5
  # Send both players back to where they were when the screenshare ends.
  return-on-unfreeze: false
  # End the screenshare when the staff member running it leaves.
  unfreeze-on-staff-leave: false
  titles:
    fade-in-ticks: 10
    stay-ticks: 100
    fade-out-ticks: 20
  punishments:
    # Leaving for one of these reasons during a screenshare runs leave-commands.
    leave-reasons:
      - DISCONNECTED
      - TIMED_OUT
      - ERRONEOUS_STATE
      - KICKED
    # Kicks with these causes never count as leaving.
    excused-kick-causes:
      - PLUGIN
      - KICK_COMMAND
      - BANNED
      - IP_BANNED
      - WHITELIST
      - RESTART_COMMAND
      - IDLING
    # Run from the console. %player%, %player_uuid%, %staff% and %freeze_point% work here.
    leave-commands:
      - "ban %player% 7d Refusing Screenshare - leaving during screenshare."
  restrictions:
    # Frozen players take no damage.
    invulnerable: true
    # The only commands a frozen player can use.
    allowed-commands:
      - msg
      - message
      - tell
      - w
      - r
      - reply
      - helpop
  visuals:
    # A block worn on the head of the frozen player.
    ice-head:
      enabled: true
      material: ICE
      scale: 0.62
      offset: -0.2
    # Particles circling the frozen player.
    particles:
      enabled: true
      type: DUST
      color: "#8BD7FF"
      size: 0.8
      amount: 2
      radius: 0.45
      height: 1.8
      # Ticks between two particle rounds.
      interval: 10
  sounds:
    freeze:
      enabled: true
      sound: block.glass.break
      volume: 0.8
      pitch: 1.4
    unfreeze:
      enabled: true
      sound: block.amethyst_block.chime
      volume: 1.0
      pitch: 1.2
    leave:
      enabled: true
      sound: block.note_block.bass
      volume: 1.0
      pitch: 0.6
    voice-expired:
      enabled: true
      sound: block.note_block.pling
      volume: 0.8
      pitch: 1.0
    point-created:
      enabled: true
      sound: entity.experience_orb.pickup
      volume: 0.6
      pitch: 1.2
    point-deleted:
      enabled: true
      sound: entity.item.break
      volume: 0.6
      pitch: 1.0

# /broadcast, /announce and /announcement. The chat line and the title are in
# messages.yml under broadcast. On 1.21.9 and newer %head% shows the sender's
# head; older servers leave it out.
broadcast:
  console-name: "Console"
  title:
    enabled: true
    fade-in-ticks: 10
    stay-ticks: 100
    fade-out-ticks: 20
  sound:
    enabled: true
    sound: minecraft:entity.experience_orb.pickup
    volume: 1.0
    pitch: 1.0

# Automatic announcements. Every group runs on its own timer and shows its
# messages one after another, starting over at the end. A message is one line,
# or a list of lines sent together. & colors, &#hex colors and MiniMessage tags
# such as <click:open_url:'https://...'> work, and so do %prefix%, %store% and
# %discord%. Add as many groups as you like.
announcer:
  enabled: true
  groups:
    tips:
      interval: 10m
      sound:
        enabled: true
        sound: minecraft:block.note_block.pling
        volume: 0.8
        pitch: 1.2
      messages:
        - - ""
          - "%prefix% &#ddededUse %accent%/killeffect &#ddededto pick an effect for your kills."
          - ""
        - - ""
          - "%prefix% &#ddededCheck the best players with %accent%/leaderboard&#ddeded."
          - ""
        - - ""
          - "%prefix% &#ddededEvery placed block is cleared every few minutes, so build fast!"
          - ""
    links:
      interval: 15m
      sound:
        enabled: true
        sound: minecraft:entity.experience_orb.pickup
        volume: 1.0
        pitch: 1.0
      messages:
        - - ""
          - "%prefix% &#ddededSupport the server: <click:open_url:'https://%store%'><hover:show_text:'Open the store'>%accent%&n%store%</hover></click>"
          - "%prefix% &#ddededJoin the community: <click:open_url:'https://%discord%'><hover:show_text:'Join the Discord'>%accent%&n%discord%</hover></click>"
          - ""

# Totem limit. A player carrying more totems than this (inventory and
# offhand together) has the extra ones moved into their ender chest; when it
# is full they drop at their feet. -1 disables the limit.
# diamondsmp.totem.bypass ignores it.
totems:
  limit: 3

heal:
  clear-effects: true
  extinguish: true

near:
  radius: 200

trash:
  # Rows of the disposal menu, 1 to 6.
  rows: 4

# Chat filter. A chat or private message containing one of these words is
# blocked and the commands below run from the console. Matching ignores case,
# repeated letters, spaces and common swaps such as 1 for i or @ for a.
# Short words (under 5 letters) only match as a whole word, so "kys" never
# hits "skyscraper". diamondsmp.chatfilter.bypass is never filtered.
chat-filter:
  enabled: true
  words:
    - "Nigga"
    - "Nigger"
    - "Niggas"
    - "Niggers"
    - "Faggot"
    - "Faggots"
    - "kys"
  # Run from the console, in order. %player% and %uuid% work here.
  commands:
    - "mute %player% 1h Automatic mute: inappropriate language"

chat:
  # Empty lines sent by /clearchat.
  clear-lines: 100

join-quit:
  # Replace the join and quit messages with the ones in messages.yml.
  # Leave a message empty there to hide it.
  enabled: true
