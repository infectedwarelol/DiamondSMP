      diamondsmp.screenshare.unfreeze: true
      diamondsmp.screenshare.freezepoint.list: true
      diamondsmp.screenshare.info: true
      diamondsmp.screenshare.list: true
      diamondsmp.screenshare.notify: true
  diamondsmp.screenshare.freeze:
    description: Use /freeze.
    default: op
  diamondsmp.screenshare.unfreeze:
    description: Use /unfreeze on your own screenshares.
    default: op
  diamondsmp.screenshare.unfreeze.others:
    description: Unfreeze players screenshared by another staff member.
    default: op
  diamondsmp.screenshare.freezepoint.set:
    description: Use /setfreezepoint.
    default: op
  diamondsmp.screenshare.freezepoint.delete:
    description: Use /delfreezepoint.
    default: op
  diamondsmp.screenshare.freezepoint.list:
    description: Use /freezepoints.
    default: op
  diamondsmp.screenshare.info:
    description: Use /screenshare info.
    default: op
  diamondsmp.screenshare.list:
    description: Use /screenshare list.
    default: op
  diamondsmp.screenshare.notify:
    description: Receive screenshare notifications.
    default: op
  diamondsmp.screenshare.reload:
    description: Use /screenshare reload.
    default: op
  diamondsmp.screenshare.bypass:
    description: Can never be frozen. Must be granted explicitly.
    default: false

  diamondsmp.teleport.*:
